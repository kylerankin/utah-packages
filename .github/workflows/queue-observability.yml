name: CI queue-observability

# Issue #304: CI runner saturation is chronic, and the evidence for it has so
# far been captured by hand after the fact. This job makes queue wait a number
# we watch: it measures, for every completed rebuild run, how long the run sat
# pending before its first job actually started, and reports the p50/p90/max.
#
# It is deliberately read-only against the pipeline: it only lists runs and
# their jobs (actions: read). It changes nothing about how runs are scheduled;
# merging a mitigation for the saturation itself (#1 merge queue, #2 priority
# lane) is a maintainer decision this job does not make.

on:
  schedule:
    # 07:00 UTC, after the 03:17 rebuild and 06:41 bump crons have settled and
    # before most interactive shepherding starts. Offsetting from those crons is
    # mitigation #4, which is a maintainer call; this slot is a guess.
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/queue-observability.yml
      - tools/queue_wait.py
      - tests/test_queue_wait.py

permissions:
  contents: read
  actions: read

jobs:
  queue-wait:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Measure queue wait for the rebuild workflow
        # The tool writes reports/queue-wait.json and prints the overall summary
        # to stdout. It exits non-zero when p50 exceeds the threshold, which is
        # the alert: this job goes red and the daily run is the notification.
        run: |
          set -euo pipefail
          threshold=()
          # The agreed threshold is a maintainer decision (#304 "Done when"), so
          # it lives in a repo variable and defaults to off. The metric (the
          # report) is always produced; the alert is opt-in.
          if [ -n "${{ vars.QUIET_THRESHOLD }}" ]; then
            threshold=(--threshold "${{ vars.QUIET_THRESHOLD }}")
          fi
          python3 tools/queue_wait.py \
            --workflow rebuild-rpms.yml \
            --limit 50 \
            "${threshold[@]}" \
            --output reports/queue-wait.json
      - name: Summarise the result in the step
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          report=reports/queue-wait.json
          if [ ! -f "$report" ]; then
            echo ":warning: Queue-observability produced no report (see logs)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$report" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          report = json.load(open(sys.argv[1]))
          overall = report["overall"]
          print("## CI queue wait — " + report["measured_at"])
          print()
          print(f"Runs measured: **{overall['runs_measured']}** / observed {report['runs_observed']}")
          print(
              f"p50: **{overall['p50_seconds'] / 60:.1f} min**"
              f" · p90: **{overall['p90_seconds'] / 60:.1f} min**"
              f" · max: **{overall['max_seconds'] / 60:.1f} min**"
          )
          worst = overall.get("worst")
          if worst:
              print(
                  f"Worst: run #{worst['run_number']} ({worst['head_branch']}) — "
                  f"{worst['wait_seconds'] / 60:.1f} min, {worst['conclusion']}"
              )
          if overall.get("threshold_exceeded"):
              print(
                  "\n:rotating_light: p50 queue wait exceeds the "
                  f"{overall['threshold_seconds'] / 60:.0f} min threshold (issue #304)."
              )
          else:
              threshold = overall.get("threshold_seconds")
              if threshold:
                  print(f"\nWithin the {threshold / 60:.0f} min threshold.")
              else:
                  print("\nNo threshold set (set QUEUE_WAIT_THRESHOLD to alert).")
          PY
